name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build + host test deps
        run: >
          npm install --no-save --no-package-lock
          typescript@5.6
          @types/node@22
          @deepseek-ai/dsh-tools@0.2.1-rc.5
          @deepseek-ai/schemastery@3.18.5
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
