name: Publish npm

# Publishes with npm trusted publishing (OIDC) — no long-lived NPM_TOKEN secret.
# The npm trusted publisher for this package allows `npm publish` (direct) from
#   repo: Dogwind221/dwguard-dsh-hmos
#   workflow: publish.yml
# Configure it with: npm trust github dwguard-dsh-hmos --file publish.yml \
#   --repo Dogwind221/dwguard-dsh-hmos --allow-publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 is required for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build committed lib
        run: npm run build
      - name: Reject stale committed lib
        run: git diff --exit-code
      - name: Test
        run: npm test
      - name: Verify tag matches package.json.version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - name: Verify npm pack contents
        run: node scripts/verify-publish.mjs
      - name: Check whether the version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not published yet — publishing."
          fi
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public
